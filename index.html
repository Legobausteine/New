<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Klangkiste">
<title>Klangkiste</title>
<style>
:root{--bg:#14110f;--card:#1d1916;--card2:#272220;--txt:#f4efe8;--mut:#9a8f84;--acc:#ffb347;--acc2:#ff7a45;--danger:#f87171;--line:#2d2723}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{padding:calc(12px + env(safe-area-inset-top)) 14px 6px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1,.brand{font-size:21px;margin:0;font-weight:800;letter-spacing:.3px}
h1 span,.brand span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#2a1200;border:0;border-radius:12px;padding:9px 13px;font-weight:700;font-size:13.5px;cursor:pointer;flex:none}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--txt)}
.row{display:flex;gap:8px}
.tabs{display:flex;gap:4px;background:var(--card);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;background:none;border:0;color:var(--mut);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--card2);color:var(--acc)}
#tools{display:flex;gap:8px}
input[type=search],input[type=text],select{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
select{flex:0 0 auto}
input:focus{border-color:var(--acc)}
#list{flex:1;min-height:0;overflow-y:auto;padding:6px 10px 12px;-webkit-overflow-scrolling:touch}
.item{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:12px;cursor:pointer}
.item:hover{background:var(--card)}
.item.playing{background:var(--card2)}
.item.playing .t{color:var(--acc)}
.thumb{width:46px;height:46px;border-radius:9px;background:var(--card2) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--mut);font-size:20px}
.meta{flex:1;min-width:0}
.t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.d{font-size:12px;color:var(--mut);flex:none}
.ib{background:none;border:0;color:var(--mut);font-size:17px;padding:6px;cursor:pointer;border-radius:8px;flex:none}
.ib:hover{color:var(--txt)}
.ib.fav.on{color:#ff5d73}
.ib.del:hover{color:var(--danger)}
.empty{text-align:center;color:var(--mut);padding:50px 24px;line-height:1.6}
.empty b{color:var(--txt);display:block;font-size:18px;margin-bottom:6px}
.plgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 4px}
.plcard{background:var(--card);border-radius:16px;padding:14px;cursor:pointer;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.plcard:hover{background:var(--card2)}
.plcard .g{position:absolute;inset:0 0 38% 0}
.plcard b,.plcard small{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plcard small{color:var(--mut)}
.sub{display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.sub h2{margin:0;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 10px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:7px 13px;font-size:13px;white-space:nowrap;cursor:pointer;flex:none}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.note{background:var(--card);border-radius:12px;padding:12px;color:var(--mut);font-size:13px;line-height:1.5;margin-bottom:8px}
.note a{color:var(--acc)}
#player{background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.now{display:flex;align-items:center;gap:12px;cursor:pointer}
.now .thumb{width:52px;height:52px}
.seek{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.seek span{width:38px;text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:5px;background:#3a332e;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--acc);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--acc);cursor:pointer}
.ctl{display:flex;align-items:center;justify-content:center;gap:2px}
.ctl button{background:none;border:0;color:var(--txt);font-size:21px;width:44px;height:44px;border-radius:50%;cursor:pointer}
.ctl button.on{color:var(--acc)}
.ctl button.play{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#2a1200;width:54px;height:54px;margin:0 4px}
.vol{display:flex;align-items:center;gap:6px;margin-left:8px;width:110px}
@media(max-width:560px){.vol{display:none}}
#toast{position:fixed;left:50%;bottom:200px;transform:translateX(-50%);background:#000c;backdrop-filter:blur(6px);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center;z-index:30}
#toast.show{opacity:1}
#drop{position:fixed;inset:0;background:#14110fee;display:none;place-items:center;font-size:22px;color:var(--acc);z-index:9;border:3px dashed var(--acc);margin:10px;border-radius:20px}
#drop.show{display:grid}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.ov .box{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:78vh;overflow-y:auto}
.ov h3{margin:0 0 10px;font-size:16px}
.qh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#sheetBox>button.crow{display:flex;align-items:center;gap:12px}
#sheetBox>button.crow img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--card)}
#sheetBox>button.crow small{display:block;color:var(--mut);margin-top:2px}
#sheetBox>button{display:block;width:100%;text-align:left;background:var(--card2);color:var(--txt);border:0;border-radius:12px;padding:13px;margin-bottom:6px;font-size:14.5px;cursor:pointer}
.eqrow{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:14px}
.eqrow span:first-child{width:60px}.eqrow span:last-child{width:46px;text-align:right;color:var(--mut)}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cvrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cvthumb{width:84px;height:84px;border-radius:12px;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;font-size:34px;color:var(--mut);flex:none}
.cvbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cvf{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.cvres{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
footer{font-size:11px;color:var(--mut);text-align:center}
/* Vollbild-Player */
#full{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--fc,#5a3214) 0%,#14110f 78%)}
#full.show{display:flex}
#fclose{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;background:#0004;border:0;color:var(--txt);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}
#fcover{width:min(78vw,380px,42vh);aspect-ratio:1;border-radius:18px;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;font-size:70px;color:var(--mut);box-shadow:0 20px 50px #0008}
.ftxt{width:min(88vw,520px);display:flex;align-items:center;gap:10px}
.ftxt .meta{flex:1}
#ftitle{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fartist{color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#full .seek{width:min(88vw,520px)}
#full .ctl{width:min(92vw,520px)}
#full .ctl button{font-size:24px}
#full .ctl button.play{width:64px;height:64px;font-size:26px}
.frow{display:flex;gap:6px;justify-content:center}
.frow button{background:#0003;border:0;color:var(--txt);padding:10px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.frow button.on{color:var(--acc)}
#sleepinfo{font-size:12px;color:var(--acc);height:14px}
.mini-pp,#miniprog,#bnav{display:none}
.h2{font-size:20px;font-weight:800;margin:16px 4px 8px}
.h2.big{font-size:26px;margin-top:8px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:2px 4px 12px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.sc{flex:0 0 140px;cursor:pointer;min-width:0}
.sc .im{width:140px;height:140px;border-radius:12px;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;font-size:40px;color:#fff9}
.sc .t{margin-top:8px;font-size:14px;font-weight:600}
.sc .a{font-size:12.5px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px}
.qt{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:8px;overflow:hidden;height:56px;cursor:pointer;font-weight:600;font-size:13.5px;min-width:0}
.qt:hover{background:#322c29}
.qt .im{width:56px;height:56px;flex:none;background:var(--card) center/cover no-repeat}
.qt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 4px}
.st{border-radius:12px;padding:12px;min-height:92px;font-weight:800;font-size:16px;cursor:pointer}
.chip.act{background:var(--acc);color:#2a1200;border-color:var(--acc);font-weight:700}
.mini-pp{background:none;border:0;color:var(--txt);font-size:24px;width:44px;height:44px;border-radius:50%;cursor:pointer;place-items:center;flex:none}
@media(max-width:899px){
  #bnav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
  .nb,.nc{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 0;cursor:pointer}
  .nb i,.nc i{font-style:normal;font-size:20px}
  .nb.on{color:var(--acc);font-weight:700}
  #player{margin:0 8px 6px;border-radius:14px;border:0;padding:8px 10px;background:var(--card2);position:relative}
  #player .seek,#player .ctl,#player footer{display:none}
  #player .now .thumb{width:44px;height:44px}
  .mini-pp{display:grid}
  #miniprog{display:block;position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:#ffffff22;border-radius:2px}
  #miniprog i{display:block;height:100%;width:0;background:var(--acc);border-radius:2px}
  #toast{bottom:150px}
}
/* Seitenleiste (nur PC) */
#side{display:none;flex-direction:column;gap:4px;padding:18px 12px;background:var(--card);overflow-y:auto;min-height:0}
#side .brand{padding:0 10px 14px}
#side .tab{text-align:left;padding:11px 12px;font-size:14px;flex:none}
.sidelbl{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px;padding:16px 12px 6px}
.sidelbl button{background:none;border:0;color:var(--acc);font-size:18px;cursor:pointer}
.plbtn{background:none;border:0;color:var(--txt);text-align:left;padding:8px 12px;border-radius:10px;font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plbtn:hover,.plbtn.on{background:var(--card2)}
@media(min-width:900px){
  body{display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"side head" "side list" "player player"}
  #side{display:flex;grid-area:side}
  header{grid-area:head}#list{grid-area:list}#player{grid-area:player}
  .tabs,header h1{display:none}
  .top{justify-content:flex-end}
  #list{padding:6px 24px 12px}
  #toast{bottom:190px}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand">Klang<span>kiste</span></div>
  <button class="tab" data-tab="home">🏠 Start</button>
  <button class="tab" data-tab="search">🔍 Suche</button>

  <button class="tab" data-tab="fav">♥ Favoriten</button>
  <button class="tab" data-tab="albums">💿 Alben</button>
  <button class="tab" data-tab="artists">🎤 Künstler</button>

<nav id="bnav">

<input type="file" id="fi" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.weba" multiple hidden>
<input type="file" id="fo" webkitdirectory multiple hidden>

<input type="file" id="cc" accept="image/*" hidden>

<script>
(()=>{
const $=s=>document.querySelector(s);
const aLocal=$('#audio'),aStream=new Audio();aStream.preload='none';
let audio=aLocal;
const AUDIO_EXT=/\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|weba|wma|mp4)$/i;
let db,tracks=[],playlists=[],ctx=[],results=[],curK=null,curUrl=null,shuffle=false,repeat=0,tab='home',openPl=null,openGrp=null;
const coverUrls=new Map();
const LIB=['pl','songs','fav','albums','artists'];let sq='';
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('klangkiste',1);
  r.onupgradeneeded=()=>{const d=r.result;
    d.createObjectStore('tracks',{keyPath:'id',autoIncrement:true});
    d.createObjectStore('blobs');
    d.createObjectStore('playlists',{keyPath:'id',autoIncrement:true});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const txDone=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
async function saveTrack(meta,blob){
  const t=db.transaction(['tracks','blobs'],'readwrite');
  const id=await req(t.objectStore('tracks').add(meta));
  t.objectStore('blobs').put(blob,id);
  await txDone(t);
  meta.id=id;meta.k='l'+id;return meta;
}
const putTrack=t=>{const o={...t};delete o.k;return req(db.transaction('tracks','readwrite').objectStore('tracks').put(o));};
const putPl=p=>req(db.transaction('playlists','readwrite').objectStore('playlists').put(p));
async function loadAll(){
  tracks=await req(db.transaction('tracks').objectStore('tracks').getAll());
  tracks.forEach(t=>t.k='l'+t.id);
  playlists=await req(db.transaction('playlists').objectStore('playlists').getAll());
}

/* ---------- ID3 ---------- */
function dec(bytes,enc){
  try{
    let s;
    if(enc===0)s=new TextDecoder('windows-1252').decode(bytes);
    else if(enc===1){
      if(bytes[0]===0xFE&&bytes[1]===0xFF)s=new TextDecoder('utf-16be').decode(bytes.subarray(2));
      else if(bytes[0]===0xFF&&bytes[1]===0xFE)s=new TextDecoder('utf-16le').decode(bytes.subarray(2));
      else s=new TextDecoder('utf-16le').decode(bytes);
    }else if(enc===2)s=new TextDecoder('utf-16be').decode(bytes);
    else s=new TextDecoder('utf-8').decode(bytes);
    return s.split('\0')[0].trim();
  }catch(e){return '';}
}
const synch=(b,o)=>(b[o]<<21)|(b[o+1]<<14)|(b[o+2]<<7)|b[o+3];
function unsync(b){const o=new Uint8Array(b.length);let j=0;for(let i=0;i<b.length;i++){o[j++]=b[i];if(b[i]===0xFF&&b[i+1]===0x00)i++;}return o.subarray(0,j);}
function scanImage(b){
  const n=b.length;
  for(let i=10;i<n-8;i++){
    if(b[i]===0xFF&&b[i+1]===0xD8&&b[i+2]===0xFF){
      for(let j=n-2;j>i+100;j--){if(b[j]===0xFF&&b[j+1]===0xD9)return new Blob([b.slice(i,j+2)],{type:'image/jpeg'});}
    }

async function readID3(file){
  const out={};

    const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33)return out;
    const ver=head[3];

    if(ver>=3&&(head[5]&0x40)){
      const ext=ver===4?synch(b,pos):((b[pos]<<24)|(b[pos+1]<<16)|(b[pos+2]<<8)|b[pos+3])+4;
      pos+=ext;
    }

    while(pos+hLen<=end){
      if(b[pos]===0)break;
      const id=String.fromCharCode(...b.subarray(pos,pos+idLen));

      if(ver===2)fs=(b[pos+3]<<16)|(b[pos+4]<<8)|b[pos+5];
      else if(ver===4){
        const fsS=synch(b,pos+4),fsB=((b[pos+4]<<24)|(b[pos+5]<<16)|(b[pos+6]<<8)|b[pos+7])>>>0;
        const okNext=sz=>{const q=pos+10+sz;if(q+4>=end)return q<=end;return b[q]===0||/[A-Z0-9]/.test(String.fromCharCode(b[q]));};
        fs=((b[pos+4]|b[pos+5]|b[pos+6]|b[pos+7])&0x80)?fsB:(okNext(fsS)?fsS:(okNext(fsB)?fsB:fsS));
      }
      else fs=((b[pos+4]<<24)|(b[pos+5]<<16)|(b[pos+6]<<8)|b[pos+7])>>>0;
      if(fs<=0||pos+hLen+fs>end)break;
      let d=b.subarray(pos+hLen,pos+hLen+fs);
      if(ver===4){
        const f2=b[pos+9];

        if(f2&0x40)d=d.subarray(1);

        if(f2&0x01)d=d.subarray(4);
      }else if(ver===3){

        if(f2&0x20)d=d.subarray(1);
      }
      if(d.length<2){pos+=hLen+fs;continue;}
      if(id==='TIT2'||id==='TT2')out.title=dec(d.subarray(1),d[0]);
      else if(id==='TPE1'||id==='TP1')out.artist=dec(d.subarray(1),d[0]);
      else if(id==='TALB'||id==='TAL')out.album=dec(d.subarray(1),d[0]);
      else if(id==='PIC'&&!out.cover){
        const enc=d[0];const f=String.fromCharCode(...d.subarray(1,4)).toLowerCase();let i=5;
        if(enc===0||enc===3){while(i<d.length&&d[i]!==0)i++;i++;}
        else{while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2;}
        const img=d.subarray(i);
        if(img.length>100)out.cover=new Blob([img.slice()],{type:f==='png'?'image/png':'image/jpeg'});
      }
      else if(id==='APIC'&&!out.cover){
        const enc=d[0];let i=1;
        while(i<d.length&&d[i]!==0)i++;

        i+=2;
        if(enc===0||enc===3){while(i<d.length&&d[i]!==0)i++;i++;}
        else{while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2;}
        const img=d.subarray(i);
        if(img.length>100){
          if(img[0]===0xFF&&img[1]===0xD8)mime='image/jpeg';
          else if(img[0]===0x89&&img[1]===0x50)mime='image/png';
          else if(!mime.startsWith('image/'))mime='image/jpeg';
          out.cover=new Blob([img.slice()],{type:mime==='image/jpg'?'image/jpeg':mime});
        }
      }
      pos+=hLen+fs;
    }
    if(!out.cover){const c=scanImage(b);if(c)out.cover=c;}
  }catch(e){}
  return out;
}

const u8s=(b,a,e)=>new TextDecoder('utf-8').decode(b.subarray(a,e));
function atoms(b,s,e){const r=[];let p=s;while(p+8<=e){const sz=((b[p]<<24)|(b[p+1]<<16)|(b[p+2]<<8)|b[p+3])>>>0;const ty=String.fromCharCode(b[p+4],b[p+5],b[p+6],b[p+7]);if(sz<8||p+sz>e)break;r.push({ty,s:p+8,e:p+sz});p+=sz;}return r;}
function parseIlst(b,out){
  const udta=atoms(b,0,b.length).find(a=>a.ty==='udta');if(!udta)return;
  const meta=atoms(b,udta.s,udta.e).find(a=>a.ty==='meta');if(!meta)return;
  const ilst=atoms(b,meta.s+4,meta.e).find(a=>a.ty==='ilst');if(!ilst)return;
  for(const it of atoms(b,ilst.s,ilst.e)){
    const d=atoms(b,it.s,it.e).find(a=>a.ty==='data');if(!d)continue;
    const flags=(b[d.s+1]<<16)|(b[d.s+2]<<8)|b[d.s+3];
    if(it.ty==='covr'){if(!out.cover&&d.e-d.s-8>100)out.cover=new Blob([b.slice(d.s+8,d.e)],{type:flags===14?'image/png':'image/jpeg'});}
    else if(it.ty==='\u00a9nam')out.title=u8s(b,d.s+8,d.e).trim();
    else if(it.ty==='\u00a9ART')out.artist=u8s(b,d.s+8,d.e).trim();
    else if(it.ty==='\u00a9alb')out.album=u8s(b,d.s+8,d.e).trim();
  }
}
async function readMP4(file){
  const out={};
  try{
    let off=0;const total=file.size;
    while(off+8<=total){
      const hd=new DataView(await file.slice(off,off+16).arrayBuffer());
      let size=hd.getUint32(0),hlen=8;
      const type=String.fromCharCode(hd.getUint8(4),hd.getUint8(5),hd.getUint8(6),hd.getUint8(7));
      if(size===1){if(hd.byteLength<16)break;size=Number(hd.getBigUint64(8));hlen=16;}
      else if(size===0)size=total-off;
      if(size<8)break;
      if(type==='moov'){
        if(size>40*1024*1024)break;
        parseIlst(new Uint8Array(await file.slice(off+hlen,off+size).arrayBuffer()),out);break;
      }
      off+=size;
    }
  }catch(e){}
  return out;
}
async function readFLAC(file){
  const out={};
  try{
    let off=4;
    while(off+4<=file.size){
      const h=new Uint8Array(await file.slice(off,off+4).arrayBuffer());
      const last=h[0]&0x80,type=h[0]&0x7f,len=(h[1]<<16)|(h[2]<<8)|h[3];
      off+=4;
      if(type===4&&len<2e6){
        const b=new Uint8Array(await file.slice(off,off+len).arrayBuffer());const dv=new DataView(b.buffer);
        let p=4+dv.getUint32(0,true);const n=dv.getUint32(p,true);p+=4;
        for(let i=0;i<n&&p+4<=b.length;i++){
          const l=dv.getUint32(p,true);p+=4;const str=u8s(b,p,p+l);p+=l;
          const k=str.indexOf('=');if(k<0)continue;
          const key=str.slice(0,k).toUpperCase(),val=str.slice(k+1).trim();
          if(key==='TITLE')out.title=val;else if(key==='ARTIST')out.artist=val;else if(key==='ALBUM')out.album=val;
        }
      }else if(type===6&&!out.cover&&len<20e6){
        const b=new Uint8Array(await file.slice(off,off+len).arrayBuffer());const dv=new DataView(b.buffer);
        let p=4;const ml=dv.getUint32(p);p+=4;
        const mime=String.fromCharCode(...b.subarray(p,p+ml));p+=ml;
        const dl=dv.getUint32(p);p+=4+dl+16;
        const pl=dv.getUint32(p);p+=4;
        if(pl>100)out.cover=new Blob([b.slice(p,p+pl)],{type:mime||'image/jpeg'});
      }
      off+=len;if(last)break;

  return out;
}
async function readTags(file){
  try{
    const h=new Uint8Array(await file.slice(0,12).arrayBuffer());
    const sig=String.fromCharCode(...h.subarray(0,4)),sig2=String.fromCharCode(...h.subarray(4,8));
    if(sig.startsWith('ID3'))return await readID3(file);
    if(sig2==='ftyp'){const r=await readMP4(file);r.fmt='MP4/M4A';return r;}
    if(sig==='OggS'){const r=await readOgg(file);r.fmt='Ogg/Opus';return r;}
    if(sig==='fLaC'){const r=await readFLAC(file);r.fmt='FLAC';return r;}
    return {fmt:'ohne Tag-Kopf ('+[...h.subarray(0,4)].map(x=>x.toString(16).padStart(2,'0')).join('')+')'};
  }catch(e){}

function parsePicBlock(b){

  let p=4;const ml=dv.getUint32(p);p+=4;
  const mime=String.fromCharCode(...b.subarray(p,p+ml));p+=ml;
  const dl=dv.getUint32(p);p+=4+dl+16;
  const pl=dv.getUint32(p);p+=4;
  return pl>100?new Blob([b.slice(p,p+pl)],{type:mime&&mime.startsWith('image/')?mime:'image/jpeg'}):null;

function b64u8(str){const bin=atob(str.replace(/\s/g,''));const o=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o;}
async function readOgg(file){
  const out={};
  try{
    let off=0,cur=[],packets=[];const total=file.size;
    while(packets.length<2&&off+27<=total){
      const h=new Uint8Array(await file.slice(off,off+27).arrayBuffer());
      if(String.fromCharCode(h[0],h[1],h[2],h[3])!=='OggS')break;
      const ns=h[26];
      const seg=new Uint8Array(await file.slice(off+27,off+27+ns).arrayBuffer());
      let plen=0;for(const v of seg)plen+=v;
      const pay=new Uint8Array(await file.slice(off+27+ns,off+27+ns+plen).arrayBuffer());
      let p=0;
      for(const v of seg){
        cur.push(pay.subarray(p,p+v));p+=v;
        if(v<255){packets.push(catU8(cur));cur=[];if(packets.length>=2)break;}
      }
      off+=27+ns+plen;
      if(off>80*1024*1024)break;
    }
    const b=packets[1];
    if(!b){out.diag='Pakete: '+packets.length+', Seiten bis '+off;return out;}
    const keys=[];
    let p=0;
    const head=String.fromCharCode(...b.subarray(0,8));
    if(head==='OpusTags')p=8;else if(b[0]===3&&String.fromCharCode(...b.subarray(1,7))==='vorbis')p=7;else return out;
    const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
    p+=4+dv.getUint32(p,true);
    const n=dv.getUint32(p,true);p+=4;
    for(let i=0;i<n&&p+4<=b.length;i++){
      const l=dv.getUint32(p,true);p+=4;
      let q=p;while(q<p+l&&b[q]!==61)q++;

      keys.push(key.slice(0,24)+(l>2000?'('+Math.round(l/1000)+'k)':''));
      if(key==='METADATA_BLOCK_PICTURE'){
        if(!out.cover){try{out.cover=parsePicBlock(b64u8(u8s(b,q+1,p+l)));}catch(e){}}
      }else if(key==='COVERART'){
        if(!out.cover){try{const im=b64u8(u8s(b,q+1,p+l));if(im.length>100)out.cover=new Blob([im],{type:im[0]===0x89?'image/png':'image/jpeg'});}catch(e){}}
      }else{
        const val=u8s(b,q+1,p+l).trim();
        if(key==='TITLE')out.title=val;else if(key==='ARTIST')out.artist=val;else if(key==='ALBUM')out.album=val;
      }
      p+=l;
    }
    out.diag='Tags: '+keys.join(' ')+' | Paket '+b.length+'B';
    if(!out.cover){const c=scanImage(b);if(c){out.cover=c;out.diag+=' (Bild per Suche)';}}
  }catch(e){out.diag='Fehler: '+e.message;}
  return out;
}

function getDuration(blob){return new Promise(res=>{
  const a=new Audio(),u=URL.createObjectURL(blob);
  const fin=d=>{URL.revokeObjectURL(u);res(d);};
  a.preload='metadata';
  a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0);
  a.onerror=()=>fin(0);
  setTimeout(()=>fin(0),6000);
  a.src=u;

let importing=false;
async function addFiles(fileList){
  if(importing)return;
  const files=[...fileList].filter(f=>f.type.startsWith('audio/')||AUDIO_EXT.test(f.name));
  if(!files.length){toast('Keine Audio-Dateien gefunden');return;}
  importing=true;let n=0,skipped=0,failed=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    toast(`Importiere ${i+1} / ${files.length}…`,99999);
    if(tracks.some(t=>t.fileName===f.name&&t.size===f.size)){skipped++;continue;}
    try{
      const tags=await readTags(f);
      const base=f.name.replace(/\.[^.]+$/,'');
      const meta={fileName:f.name,size:f.size,title:tags.title||base,artist:tags.artist||'',album:tags.album||'',cover:tags.cover||null,coverV:4,duration:await getDuration(f),added:Date.now()+i,fav:false};
      const nk=x=>(x||'').toLowerCase().replace(/\s+/g,' ').trim();
      if(tracks.some(t=>nk(t.title)===nk(meta.title)&&nk(t.artist)===nk(meta.artist)&&(!t.duration||!meta.duration||Math.abs(t.duration-meta.duration)<=2))){skipped++;continue;}
      tracks.push(await saveTrack(meta,f));
      n++;
    }catch(e){failed++;if(e&&e.name==='QuotaExceededError'){toast('Speicher voll – Import abgebrochen',4000);break;}}
  }
  importing=false;
  render();updateInfo();
  toast(`${n} hinzugefügt`+(skipped?`, ${skipped} schon vorhanden`:'')+(failed?`, ${failed} fehlgeschlagen`:''),3500);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}

let lastMiss=[],lastDiag='';
async function rescanCovers(force){
  let n=0;lastMiss=[];lastDiag='';
  for(const t of tracks){
    if(t.stream||t.cover||(t.coverV===4&&!force))continue;
    try{
      const blob=await req(db.transaction('blobs').objectStore('blobs').get(t.id));
      if(blob){const tags=await readTags(blob);t.fmt=tags.fmt||'';if(tags.cover){t.cover=tags.cover;n++;}else{lastMiss.push(tags.fmt||'?');if(!lastDiag)lastDiag=tags.diag||'';}if(!t.album&&tags.album)t.album=tags.album;}
    }catch(e){}

}

function rows(container,items){
  const frag=document.createDocumentFragment();
  items.forEach((t,idx)=>{
    const it=el('div','item'+(t.k===curK?' playing':''));it.dataset.k=t.k;
    const th=el('div','thumb');setThumb(th,t);
    const m=el('div','meta');m.append(el('div','t',t.title),el('div','a',t.artist||'Unbekannter Künstler'));
    it.append(th,m,el('div','d',fmt(t.duration)));
    const btn=(txt,title,fn,cls='')=>{const b=el('button','ib '+cls,txt);b.title=title;b.onclick=e=>{e.stopPropagation();fn();};it.appendChild(b);};
    if(t.stream){
      btn('⬇','Offline speichern',()=>download(t));
      btn('⋯','Mehr',()=>itemMenu(t));
    }else{
      btn('♥','Favorit',()=>toggleFav(t),'fav'+(t.fav?' on':''));
      if(tab==='pl'&&openPl!=null){
        btn('▲','Hoch',()=>moveInPl(idx,-1));
        btn('▼','Runter',()=>moveInPl(idx,1));
        btn('✕','Aus Playlist entfernen',()=>removeFromPl(t.id),'del');
      }else{
        btn('⋯','Mehr',()=>itemMenu(t));
        btn('✕','Löschen',()=>removeTrack(t.id),'del');
      }
    }
    it.onclick=()=>play(t,getList());
    frag.appendChild(it);
  });
  container.appendChild(frag);
}
function markPlaying(){document.querySelectorAll('.item').forEach(e=>e.classList.toggle('playing',e.dataset.k===curK));}

/* ---------- Start / Suche / Bibliothek ---------- */
function card(title,sub,img,hue,fn){
  const c=el('div','sc');const im=el('div','im');
  if(img)im.style.backgroundImage=`url("${img}")`;
  else{im.style.background=`linear-gradient(135deg,hsl(${hue},60%,42%),hsl(${(hue+50)%360},65%,30%))`;im.textContent='♪';}
  c.append(im,el('div','t',title),el('div','a',sub));c.onclick=fn;return c;
}
function shelf(list,title,cards){
  if(!cards.length)return;
  list.appendChild(el('div','h2',title));
  const s=el('div','shelf');cards.forEach(c=>s.appendChild(c));list.appendChild(s);
}
const trackCards=items=>items.map((t,i)=>card(t.title,t.artist||'Unbekannter Künstler',coverOf(t),(i*47+20)%360,()=>play(t,items)));
function readRecent(){try{return JSON.parse(ls.get('om_recent')||'[]');}catch(e){return [];}}
function recentTracks(){return readRecent().map(id=>tracks.find(t=>t.id===id)).filter(Boolean);}
function pushRecent(t){if(t.stream)return;ls.set('om_recent',JSON.stringify([t.id,...readRecent().filter(x=>x!==t.id)].slice(0,20)));}
function renderHome(list){
  const h=new Date().getHours();
  list.appendChild(el('div','h2 big',h<5?'Gute Nacht':h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend'));

  const g=el('div','qgrid');
  const tile=(txt,hue,fn)=>{const q=el('div','qt');const im=el('div','im');im.style.background=`linear-gradient(135deg,hsl(${hue},60%,42%),hsl(${(hue+50)%360},65%,30%))`;q.append(im,el('span','',txt));q.onclick=fn;return q;};
  g.appendChild(tile('♥ Favoriten',350,()=>{tab='fav';render();}));
  g.appendChild(tile('Alle Songs',30,()=>{tab='songs';render();}));
  playlists.slice(0,4).forEach((p,i)=>g.appendChild(tile(p.name,(i*67+25)%360,()=>{tab='pl';openPl=p.id;render();})));
  list.appendChild(g);
  shelf(list,'Zuletzt gehört',trackCards(recentTracks().slice(0,12)));
  shelf(list,'Neu hinzugefügt',trackCards([...tracks].sort((a,b)=>b.added-a.added).slice(0,12)));
  shelf(list,'Deine Playlists',playlists.map((p,i)=>card(p.name,`${p.ids.length} Songs`,null,(i*67+25)%360,()=>{tab='pl';openPl=p.id;render();})));
  const map=new Map();tracks.forEach(t=>{if(!t.album)return;if(!map.has(t.album))map.set(t.album,[]);map.get(t.album).push(t);});
  shelf(list,'Alben',[...map.entries()].slice(0,12).map(([k,arr],i)=>card(k,`${arr.length} Songs`,coverOf(arr.find(t=>t.cover)),(i*47+20)%360,()=>{tab='albums';openGrp=k;render();})));
}
function renderSearch(list){
  const inp=el('input');inp.type='search';inp.placeholder='Was möchtest du hören?';inp.value=sq;
  inp.style.cssText='width:100%;margin:6px 0 12px;font-size:16px;padding:13px 14px;flex:none';

/* ---------- Alben / Künstler ---------- */
function renderGroups(list){
  const map=new Map();
  for(const t of tracks){const k=grpKey(t);if(!map.has(k))map.set(k,[]);map.get(k).push(t);}
  if(!map.size){list.appendChild(empty(tab==='albums'?'Noch keine Alben':'Noch keine Künstler','Füge zuerst Songs hinzu.'));return;}
  const grid=el('div','plgrid');
  [...map.keys()].sort((a,b)=>a.localeCompare(b,'de')).forEach((k,i)=>{
    const arr=map.get(k);const c=el('div','plcard');
    const g=el('div','g');
    const withCover=arr.find(t=>t.cover);
    if(withCover)g.style.cssText=`background:url("${coverOf(withCover)}") center/cover no-repeat`;
    else{const h=(i*67+25)%360;g.style.background=`linear-gradient(135deg,hsl(${h},60%,42%),hsl(${(h+50)%360},65%,30%))`;}
    c.append(g,el('b','',k),el('small','',`${arr.length} ${arr.length===1?'Song':'Songs'}`));
    c.onclick=()=>{openGrp=k;render();};
    grid.appendChild(c);
  });
  list.appendChild(grid);
}

/* ---------- Favoriten / Löschen ---------- */
async function toggleFav(t){t.fav=!t.fav;await putTrack(t);render();syncFav();}
async function removeTrack(id){
  const t=tracks.find(x=>x.id===id);if(!t)return;
  if(!confirm(`„${t.title}“ aus der App löschen?`))return;
  const tx=db.transaction(['tracks','blobs'],'readwrite');
  tx.objectStore('tracks').delete(id);tx.objectStore('blobs').delete(id);
  await txDone(tx);
  if(coverUrls.has(id)){URL.revokeObjectURL(coverUrls.get(id));coverUrls.delete(id);}
  tracks=tracks.filter(x=>x.id!==id);
  ctx=ctx.filter(x=>x.k!==t.k);
  for(const p of playlists){if(p.ids.includes(id)){p.ids=p.ids.filter(x=>x!==id);await putPl(p);}}
  if(curK===t.k){audio.pause();audio.removeAttribute('src');curK=null;updateNow(null);}
  if(openGrp!=null&&!getList().length)openGrp=null;
  render();updateInfo();
}

async function newPlaylist(thenAdd){
  const name=(prompt('Name der Playlist:')||'').trim();
  if(!name)return null;
  const p={name,ids:thenAdd!=null?[thenAdd]:[]};
  p.id=await req(db.transaction('playlists','readwrite').objectStore('playlists').add(p));
  playlists.push(p);render();
  return p;
}
function plMenu(p){
  if(!p)return;
  openSheet(p.name,[
    {label:'✏️ Umbenennen',fn:async()=>{const n=(prompt('Neuer Name:',p.name)||'').trim();if(n){p.name=n;await putPl(p);render();}}},
    {label:'🗑 Playlist löschen',fn:async()=>{if(!confirm(`Playlist „${p.name}“ löschen? Die Songs bleiben erhalten.`))return;await req(db.transaction('playlists','readwrite').objectStore('playlists').delete(p.id));playlists=playlists.filter(x=>x.id!==p.id);openPl=null;render();}}
  ]);
}
function addToPlSheet(t){
  const opts=playlists.map(p=>({label:`${p.ids.includes(t.id)?'✓ ':''}${p.name}`,fn:async()=>{
    if(p.ids.includes(t.id)){toast('Schon in der Playlist');return;}
    p.ids.push(t.id);await putPl(p);render();toast(`Zu „${p.name}“ hinzugefügt`);}}));
  opts.push({label:'＋ Neue Playlist…',fn:async()=>{const p=await newPlaylist(t.id);if(p)toast(`Zu „${p.name}“ hinzugefügt`);}});
  openSheet('Zu Playlist hinzufügen',opts);
}
async function moveInPl(idx,dir){
  const p=playlists.find(x=>x.id===openPl);if(!p)return;
  const ids=getList().map(t=>t.id);const n=idx+dir;
  if(n<0||n>=ids.length)return;
  [ids[idx],ids[n]]=[ids[n],ids[idx]];
  p.ids=ids;await putPl(p);render();
}
async function removeFromPl(id){
  const p=playlists.find(x=>x.id===openPl);if(!p)return;
  p.ids=p.ids.filter(x=>x!==id);await putPl(p);render();
}
function itemMenu(t){

/* ---------- Warteschlange ---------- */
function playNext(t){
  if(!ctx.length||curK==null){play(t,[t]);return;}
  ctx=ctx.filter(x=>x.k!==t.k||x.k===curK);
  if(t.k===curK){toast('Läuft gerade');return;}
  const i=ctx.findIndex(x=>x.k===curK);
  ctx.splice(i+1,0,t);toast('Kommt als Nächstes');renderQueueIfOpen();
}
function enqueue(t){
  if(!ctx.length||curK==null){play(t,[t]);return;}
  ctx=ctx.filter(x=>x.k!==t.k||x.k===curK);
  if(t.k!==curK)ctx.push(t);
  toast('Zur Warteschlange hinzugefügt');renderQueueIfOpen();
}
function openQueue(){$('#qsheet').classList.add('show');renderQueue();}
function renderQueueIfOpen(){if($('#qsheet').classList.contains('show'))renderQueue();}
function renderQueue(){
  const box=$('#qbox');const sc=box.scrollTop;box.textContent='';
  const h=el('div','qh');h.appendChild(el('h3','',`Warteschlange (${ctx.length})`));
  const x=el('button','btn sec','Schließen');x.onclick=()=>$('#qsheet').classList.remove('show');h.appendChild(x);
  box.appendChild(h);
  if(!ctx.length){box.appendChild(empty('Leer','Spiel einen Song ab oder füge Songs über ⋯ hinzu.'));return;}
  ctx.forEach((t,i)=>{
    const it=el('div','item'+(t.k===curK?' playing':''));
    const th=el('div','thumb');setThumb(th,t);
    const m=el('div','meta');m.append(el('div','t',t.title),el('div','a',t.artist||'Unbekannter Künstler'));
    it.append(th,m);
    const b=(txt,fn)=>{const e=el('button','ib',txt);e.onclick=ev=>{ev.stopPropagation();fn();renderQueue();};it.appendChild(e);};
    b('▲',()=>{if(i>0)[ctx[i-1],ctx[i]]=[ctx[i],ctx[i-1]];});
    b('▼',()=>{if(i<ctx.length-1)[ctx[i+1],ctx[i]]=[ctx[i],ctx[i+1]];});
    b('✕',()=>{ctx.splice(i,1);});
    it.onclick=()=>{play(t);};
    box.appendChild(it);
  });
  box.scrollTop=sc;
}
$('#qsheet').addEventListener('click',e=>{if(e.target.id==='qsheet')e.target.classList.remove('show');});

/* ---------- Entdecken (Jamendo) ---------- */
const GENRES=[['Beliebt',''],['Pop','pop'],['Rock','rock'],['Elektro','electronic'],['Hip-Hop','hiphop'],['Lofi','lofi'],['Jazz','jazz'],['Chill','chillout'],['Klassik','classical']];
function renderDisc(list){
  const key=ls.get('om_jkey')||'';
  if(!key){
    const n=el('div','note');
    n.innerHTML='Hier streamst du kostenlose, legale Musik von <b>Jamendo</b> (Creative-Commons, ohne Werbung). Dafür brauchst du einen kostenlosen Schlüssel: auf <a href="https://devportal.jamendo.com" target="_blank" rel="noopener">devportal.jamendo.com</a> registrieren, eine App anlegen und die „Client ID“ unten einfügen. Gefallene Songs kannst du per ⬇ offline speichern.';
    list.appendChild(n);
    const r=el('div','row');const inp=el('input');inp.type='text';inp.placeholder='Jamendo Client ID';
    const ok=el('button','btn','Speichern');ok.onclick=()=>{const v=inp.value.trim();if(v){ls.set('om_jkey',v);render();}};
    r.append(inp,ok);list.appendChild(r);return;
  }
  const r=el('div','row');
  const inp=el('input');inp.type='search';inp.placeholder='Künstler, Song, Stil…';
  const go=el('button','btn','Suchen');
  const doSearch=()=>{const v=inp.value.trim();if(v)loadDisc({search:v});};
  go.onclick=doSearch;inp.onkeydown=e=>{if(e.key==='Enter')doSearch();};
  r.append(inp,go);list.appendChild(r);
  const chips=el('div','chips');
  GENRES.forEach(([n,tag])=>{const c=el('button','chip',n);c.onclick=()=>loadDisc(tag?{tags:tag,order:'popularity_month'}:{order:'popularity_week'});chips.appendChild(c);});
  const kb=el('button','chip','🔑 Schlüssel ändern');kb.onclick=()=>{ls.set('om_jkey','');results=[];render();};chips.appendChild(kb);
  list.appendChild(chips);
  const res=el('div');res.id='res';list.appendChild(res);
  fillRes();
  if(!results.length&&navigator.onLine)loadDisc({order:'popularity_week'});
}
function fillRes(msg){
  const res=$('#res');if(!res)return;res.textContent='';
  if(msg){res.appendChild(empty(msg[0],msg[1]));return;}
  if(!navigator.onLine&&!results.length){res.appendChild(empty('Offline','Entdecken braucht Internet. Deine gespeicherten Songs laufen trotzdem.'));return;}
  if(!results.length){res.appendChild(empty('Keine Treffer',''));return;}
  rows(res,results);
}
async function loadDisc(params){
  const key=ls.get('om_jkey');if(!key)return;
  fillRes(['Lade…','']);
  try{
    const u=new URL('https://api.jamendo.com/v3.0/tracks/');
    u.search=new URLSearchParams({client_id:key,format:'json',limit:40,imagesize:200,audioformat:'mp32',...params});
    const r=await fetch(u);const j=await r.json();
    if(j.headers&&j.headers.status==='failed'){fillRes(['Fehler',j.headers.error_message||'Schlüssel prüfen.']);return;}
    results=(j.results||[]).map(x=>({stream:true,k:'j'+x.id,jid:x.id,title:x.name,artist:x.artist_name,album:x.album_name||'',img:x.image||x.album_image||'',audio:x.audio,dl:x.audiodownload_allowed?x.audiodownload:'',duration:x.duration}));
    fillRes();
  }catch(e){fillRes(['Keine Verbindung','Prüfe dein Internet und den Schlüssel.']);}
}
async function download(t){
  if(tracks.some(x=>x.jid===t.jid)){toast('Schon gespeichert');return;}
  toast('Lade herunter…',99999);
  try{
    const r=await fetch(t.dl||t.audio);if(!r.ok)throw new Error();
    const blob=await r.blob();
    let cover=null;try{if(t.img){const ci=await fetch(t.img);if(ci.ok)cover=await ci.blob();}}catch(e){}
    const meta={fileName:'jamendo-'+t.jid,jid:t.jid,size:blob.size,title:t.title,artist:t.artist,album:t.album||'',cover,duration:t.duration,added:Date.now(),fav:false};
    tracks.push(await saveTrack(meta,blob));
    updateInfo();renderSide();toast('Offline gespeichert ✓');
  }catch(e){toast('Download nicht möglich',3000);}
}

/* ---------- Equalizer ---------- */
let ac=null,eqF=[],eqVals=[0,0,0];
try{const v=JSON.parse(ls.get('om_eq')||'[0,0,0]');if(Array.isArray(v)&&v.length===3)eqVals=v.map(Number);}catch(e){}
function buildEQ(){
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaElementSource(aLocal);
    const types=['lowshelf','peaking','highshelf'],freqs=[120,1000,8000];
    eqF=types.map((ty,i)=>{const f=ac.createBiquadFilter();f.type=ty;f.frequency.value=freqs[i];if(ty==='peaking')f.Q.value=1;f.gain.value=eqVals[i];return f;});
    let n=src;eqF.forEach(f=>{n.connect(f);n=f;});n.connect(ac.destination);
    return true;
  }catch(e){ac=null;return false;}
}
function setEQ(i,v){
  eqVals[i]=v;ls.set('om_eq',JSON.stringify(eqVals));
  if(!ac&&!buildEQ()){toast('Equalizer nicht verfügbar');return;}
  eqF[i].gain.value=v;if(ac.state==='suspended')ac.resume();
}
function eqSheet(){
  const nodes=[];
  const sliders=[];
  const presets=el('div','presets');
  const names=['Bass','Mitten','Höhen'];
  names.forEach((n,i)=>{
    const row=el('div','eqrow');const lab=el('span','',n);
    const r=el('input');r.type='range';r.min=-12;r.max=12;r.step=1;r.value=eqVals[i];
    const val=el('span','',eqVals[i]+' dB');
    r.oninput=()=>{val.textContent=r.value+' dB';setEQ(i,+r.value);};
    row.append(lab,r,val);sliders.push([r,val]);nodes.push(row);
  });
  [['Flat',[0,0,0]],['Bass+',[7,0,0]],['Höhen+',[0,0,6]],['Stimme',[-2,4,2]],['Club',[6,-1,4]]].forEach(([n,v])=>{
    const c=el('button','chip',n);
    c.onclick=()=>{v.forEach((x,i)=>{sliders[i][0].value=x;sliders[i][1].textContent=x+' dB';setEQ(i,x);});};
    presets.appendChild(c);
  });
  nodes.unshift(presets);
  const t=curTrack();
  if(t&&t.stream)nodes.push(el('div','note','Der Equalizer wirkt nur bei gespeicherten Songs, nicht beim Streaming.'));
  openSheetNodes('Equalizer',nodes);
}

/* ---------- Sleep-Timer ---------- */
let sleepAt=0,sleepEnd=false,sleepIv=null;
function clearSleep(){clearInterval(sleepIv);sleepIv=null;sleepAt=0;sleepEnd=false;syncSleep();}
function setSleep(min){
  clearSleep();
  if(min==='end'){sleepEnd=true;}
  else{sleepAt=Date.now()+min*60000;sleepIv=setInterval(()=>{if(Date.now()>=sleepAt){clearSleep();fadeOutPause();}else syncSleep();},1000);}
  syncSleep();toast('Sleep-Timer gesetzt',1500);
}
function syncSleep(){
  let s='';
  if(sleepEnd)s='😴 Stoppt nach diesem Song';
  else if(sleepAt)s='😴 Stoppt in '+fmt((sleepAt-Date.now())/1000);
  $('#sleepinfo').textContent=s;
  document.querySelectorAll('[data-act="sleep"]').forEach(b=>b.classList.toggle('on',!!s));
}
function fadeOutPause(){
  const a=audio,v0=a.volume;let v=v0;
  const iv=setInterval(()=>{v-=v0/30;if(v<=0.02){clearInterval(iv);a.pause();a.volume=v0;}else a.volume=v;},100);
}
function sleepSheet(){
  const o=[15,30,45,60].map(m=>({label:`${m} Minuten`,fn:()=>setSleep(m)}));
  o.push({label:'Nach diesem Song',fn:()=>setSleep('end')});

async function play(t,list){

}
async function dominant(url){
  return new Promise(res=>{
    const im=new Image();im.crossOrigin='anonymous';
    im.onload=()=>{try{
      const c=document.createElement('canvas');c.width=c.height=8;
      const x=c.getContext('2d');x.drawImage(im,0,0,8,8);
      const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0,n=0;
      for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
      res([r/n,g/n,b/n]);
    }catch(e){res(null);}};
    im.onerror=()=>res(null);im.src=url;
  });
}

/* ---------- MP3-Konverter (mit Coverbild) ---------- */
const LAME_URLS=['https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js','https://unpkg.com/lamejs@1.2.1/lame.min.js'];
const LAME_CACHE='klangkiste-lib',LAME_KEY='lame.min.js';
async function loadLame(){
  if(self.lamejs&&self.lamejs.Mp3Encoder)return;
  let code=null,cached=false;
  try{const c=await caches.open(LAME_CACHE);const hit=await c.match(LAME_KEY);if(hit){code=await hit.text();cached=true;}}catch(e){}
  if(!code){
    for(const u of LAME_URLS){
      try{
        const r=await fetch(u);if(!r.ok)continue;
        code=await r.text();
        try{const c=await caches.open(LAME_CACHE);await c.put(LAME_KEY,new Response(code,{headers:{'Content-Type':'text/javascript'}}));}catch(e){}
        break;
      }catch(e){}
    }
  }
  if(!code)throw new Error('MP3-Encoder konnte nicht geladen werden – einmal mit Internet versuchen, danach geht es offline.');
  await new Promise((res,rej)=>{
    const u=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
    const s=document.createElement('script');
    s.onload=()=>{URL.revokeObjectURL(u);res();};
    s.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('MP3-Encoder fehlerhaft'));};
    s.src=u;document.head.appendChild(s);
  });
  if(!(self.lamejs&&self.lamejs.Mp3Encoder)){
    if(cached){try{(await caches.open(LAME_CACHE)).delete(LAME_KEY);}catch(e){}}
    throw new Error('MP3-Encoder fehlerhaft');
  }
}

/* ID3v2.3-Tag mit Titel, Künstler, Album und Coverbild */
const u32=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
const synsafe=n=>[(n>>21)&127,(n>>14)&127,(n>>7)&127,n&127];
function utf16(s){const o=[0xFF,0xFE];for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);o.push(c&255,c>>8);}return o;}
function id3Frame(id,d){const h=new Uint8Array(10);for(let i=0;i<4;i++)h[i]=id.charCodeAt(i);h.set(u32(d.length),4);return catU8([h,d]);}
function id3Text(id,s){return s?id3Frame(id,Uint8Array.from([1,...utf16(s)])):null;}
function buildID3(m){
  const fr=[id3Text('TIT2',m.title),id3Text('TPE1',m.artist),id3Text('TALB',m.album)];
  if(m.cover){
    const head=Uint8Array.from([0,...[...m.cover.mime].map(c=>c.charCodeAt(0)),0,3,0]);
    fr.push(id3Frame('APIC',catU8([head,m.cover.bytes])));
  }
  const body=catU8(fr.filter(Boolean));
  if(!body.length)return new Uint8Array(0);
  return catU8([Uint8Array.from([0x49,0x44,0x33,3,0,0,...synsafe(body.length)]),body]);
}
function stripTags(u8){
  let s=0,e=u8.length;
  if(u8[0]===0x49&&u8[1]===0x44&&u8[2]===0x33){s=10+((u8[6]<<21)|(u8[7]<<14)|(u8[8]<<7)|u8[9])+((u8[5]&0x10)?10:0);}
  if(e-128>=s&&u8[e-128]===0x54&&u8[e-127]===0x41&&u8[e-126]===0x47)e-=128;
  return u8.subarray(Math.min(s,e),e);
}
async function prepCover(blob){
  try{
    const bmp=await createImageBitmap(blob);
    const m=Math.min(1,600/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*m)),h=Math.max(1,Math.round(bmp.height*m));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const g=cv.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,w,h);g.drawImage(bmp,0,0,w,h);
    const out=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
    if(out)return{bytes:new Uint8Array(await out.arrayBuffer()),mime:'image/jpeg'};
  }catch(e){}
  return{bytes:new Uint8Array(await blob.arrayBuffer()),mime:blob.type==='image/png'?'image/png':'image/jpeg'};
}

/* Dekodieren + Kodieren */
const LAME_RATES=[8000,11025,12000,16000,22050,24000,32000,44100,48000];
async function decodeAudio(file){
  const AC=self.AudioContext||self.webkitAudioContext;
  if(!AC)throw new Error('Dieser Browser kann kein Audio dekodieren');
  const buf=await file.arrayBuffer();
  let ac;try{ac=new AC({sampleRate:44100});}catch(e){ac=new AC();}
  try{
    let ab=await new Promise((res,rej)=>{const p=ac.decodeAudioData(buf,res,rej);if(p&&p.catch)p.catch(rej);});
    if(!LAME_RATES.includes(ab.sampleRate)){
      const ch=ab.numberOfChannels>1?2:1;
      const oc=new OfflineAudioContext(ch,Math.ceil(ab.duration*44100),44100);
      const src=oc.createBufferSource();src.buffer=ab;src.connect(oc.destination);src.start();
      ab=await oc.startRendering();
    }
    return ab;
  }finally{try{ac.close();}catch(e){}}
}
async function encodeMp3(ab,kbps,onProg){
  const ch=ab.numberOfChannels>1?2:1,sr=ab.sampleRate;
  const L=ab.getChannelData(0),R=ch===2?ab.getChannelData(1):null;
  const enc=new lamejs.Mp3Encoder(ch,sr,kbps);
  const BS=1152,n=L.length,parts=[];
  const cv=x=>x<-1?-32768:x>1?32767:(x<0?x*32768:x*32767);
  for(let i=0,k=0;i<n;i+=BS,k++){
    const len=Math.min(BS,n-i),a=new Int16Array(len),b=ch===2?new Int16Array(len):null;
    for(let j=0;j<len;j++){a[j]=cv(L[i+j]);if(b)b[j]=cv(R[i+j]);}
    const o=ch===2?enc.encodeBuffer(a,b):enc.encodeBuffer(a);
    if(o.length)parts.push(new Uint8Array(o));
    if(k%150===0){onProg(i/n);await new Promise(r=>setTimeout(r,0));}
  }
  const f=enc.flush();if(f.length)parts.push(new Uint8Array(f));
  return parts;
}

    $('#list').appendChild(empty('Speicher nicht verfügbar','Bitte die Datei in einem normalen (nicht privaten) Browserfenster öffnen.'));
  }
})();
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));let had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl){window.__rl=1;location.reload();}had=true;});}</script>
